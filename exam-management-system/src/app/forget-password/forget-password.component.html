<div class="create-account-container">
  <mat-card class="create-account-card">
    <h2>Forgot Password</h2>
    <form (ngSubmit)="obtainPassword()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email ID</mat-label>
        <input matInput placeholder="Enter your Email ID" [(ngModel)]="email" name="email" required />
        <mat-error *ngIf="!email">Email is required</mat-error>
      </mat-form-field>

      <button mat-raised-button style="color: white; background-color: rgb(157, 73, 36)" class="full-width" type="submit">
        Obtain Password
      </button>
    </form>
  </mat-card>
</div>
