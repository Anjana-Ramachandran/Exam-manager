<div style="margin-top:100px" class="background">
  <div>
    <h2>Exam Time Table Published</h2>
  </div>
  <div class="center">
    <input style="width: 100%; height: 40px; text-align: center; margin-top: 20px;" matInput placeholder="Filter by Course ID" (input)="applyFilter($event)" />
  </div>
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" class="custom-table mat-elevation-z8">
      <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
        <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
        <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
