<body>
  <video class="bg-video" autoplay loop muted>
    <source src="loginbg.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="login-container">
    <mat-card class="login-card">
      <h2>Sign In</h2>
      <form>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>User ID</mat-label>
          <input matInput placeholder="Enter your User ID" [(ngModel)]="userId" name="userId" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput placeholder="Enter your Password" [(ngModel)]="password" name="password" type="password" required />
        </mat-form-field>

        <button mat-raised-button style="color: white;background-color: rgb(157, 73, 36);;" class="full-width" (click)="onLogin()">Sign In</button>

        <div class="links">
          <a href="forget-password">Forgot Password? | </a>  
          <a href="create-account">Create an Account</a>
        </div>
      </form>
    </mat-card>
  </div>
</body>
